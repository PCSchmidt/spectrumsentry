[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrumsentry"
version = "0.1.0"
description = "Receive-only classification of drone radio links from raw IQ samples, with honest evaluation under simulated channel and receiver shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
